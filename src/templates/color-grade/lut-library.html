      <section
        class="lut-library-section"
        id="lutLibrary"
        role="tabpanel"
        aria-labelledby="showPresetPanel"
      >
        <div class="preset-panel" id="presetPanel" data-i18n-attr="aria-label:cg.static.library">
          <div class="variants-title">
            <h2 id="lutLibraryTitle" tabindex="-1" data-i18n="cg.static.myLut">我的 LUT</h2>
            <div class="library-menu-wrap">
              <button
                class="icon-button library-menu-toggle"
                id="libraryMenuToggle"
                type="button"
                data-i18n-attr="aria-label:cg.static.openLutMenu;title:cg.static.manageLut"
                aria-controls="libraryMenu"
                aria-expanded="false"
              >
                ⋯
              </button>
              <div
                class="library-menu"
                id="libraryMenu"
                role="group"
                data-i18n-attr="aria-label:cg.static.manageLut"
                hidden
              >
                <button
                  class="subtle"
                  id="importFilters"
                  type="button"
                  data-i18n="cg.static.importFilters"
                >
                  导入滤镜
                </button>
                <button
                  class="subtle"
                  id="backupFilters"
                  type="button"
                  data-i18n="cg.static.backupFilters"
                >
                  备份我的滤镜
                </button>
                <label class="restore-mode" for="restoreMode"
                  ><span data-i18n="cg.static.restoreMode">恢复方式</span>
                  <select id="restoreMode">
                    <option value="merge" data-i18n="cg.static.merge">合并</option>
                    <option value="replace" data-i18n="cg.static.replace">替换</option>
                  </select>
                </label>
                <button
                  class="subtle"
                  id="restoreFilters"
                  type="button"
                  data-i18n="cg.static.restoreBackup"
                >
                  恢复备份
                </button>
              </div>
            </div>
            <span id="variantHint" data-i18n="cg.static.uploadToShow">上传图片后显示方案</span>
          </div>
          <div class="lut-filter-sentinel" aria-hidden="true"></div>
          <div class="lut-filter-sticky">
            <div
              class="filter-bar"
              id="filterBar"
              data-i18n-attr="aria-label:cg.static.presetFilters"
            >
              <input
                id="filterSearch"
                type="search"
                data-i18n-attr="aria-label:cg.static.intentLabel;placeholder:cg.static.intentPlaceholder"
              />
              <select id="filterSource" data-i18n-attr="aria-label:cg.static.filterSource">
                <option value="all" data-i18n="cg.static.allSources">全部来源</option>
                <option value="builtin" data-i18n="cg.static.builtInFilters">内置滤镜</option>
                <option value="user" data-i18n="cg.static.myFilters">我的滤镜</option>
              </select>
              <select id="filterScene" data-i18n-attr="aria-label:cg.static.scene">
                <option value="all" data-i18n="cg.static.allScenes">全部场景</option>
              </select>
              <label class="favorite-filter"
                ><input id="filterFavorites" type="checkbox" />
                <span data-i18n="cg.static.favorites">仅收藏</span></label
              >
              <details class="more-filters" id="moreFilters">
                <summary data-i18n="cg.static.moreFilters">更多筛选</summary>
                <div class="more-filter-fields">
                  <label for="filterRegion" data-i18n="cg.static.region">地区</label
                  ><select id="filterRegion" data-i18n-attr="aria-label:cg.static.region">
                    <option value="all" data-i18n="cg.static.allRegions">全部地区</option></select
                  ><label for="filterCamera" data-i18n="cg.static.camera">相机</label
                  ><select id="filterCamera" data-i18n-attr="aria-label:cg.static.camera">
                    <option value="all" data-i18n="cg.static.allCameras">全部相机</option>
                  </select>
                </div>
              </details>
              <button
                class="subtle"
                id="clearFilters"
                type="button"
                data-i18n="cg.static.clearFilters"
              >
                清除筛选
              </button>
            </div>
          </div>
          <div class="intent-result" id="intentResult" aria-live="polite" hidden>
            <div class="intent-chips" id="intentChips"></div>
            <p id="intentSuggestion"></p>
            <div class="intent-actions">
              <button
                id="previewIntent"
                class="primary"
                type="button"
                disabled
                data-i18n="cg.static.previewIntent"
              >
                预览
              </button>
              <button
                id="clearIntent"
                class="subtle"
                type="button"
                disabled
                data-i18n="cg.static.clearIntent"
              >
                清除
              </button>
            </div>
          </div>
          <div class="library-actions" aria-label="我的滤镜管理">
            <span
              id="libraryStatus"
              class="library-status"
              role="status"
              aria-live="polite"
              data-i18n="cg.static.filtersLocal"
              >我的滤镜保存在当前浏览器</span
            >
            <input
              id="filterImportInput"
              type="file"
              accept=".cube,.json,.3dl,application/json,text/plain"
              multiple
              hidden
            />
            <input id="filterRestoreInput" type="file" accept=".zip,application/zip" hidden />
          </div>
          <div class="filter-empty" id="filterEmpty" hidden data-i18n="cg.static.noPresets">
            没有匹配的预设
          </div>
          <section class="variants" id="variants"></section>
          <nav
            class="filter-pagination"
            id="filterPagination"
            data-i18n-attr="aria-label:cg.static.pagination"
            hidden
          >
            <button
              id="previousVariantPage"
              class="subtle"
              type="button"
              data-i18n-attr="aria-label:cg.static.previous"
            >
              上一页</button
            ><span id="variantPageStatus" aria-live="polite"></span
            ><button
              id="nextVariantPage"
              class="subtle"
              type="button"
              data-i18n-attr="aria-label:cg.static.next"
            >
              下一页
            </button>
          </nav>
        </div>
      </section>
    </div>
